    <!-- Chosen Palette: Warm Neutrals -->
    <!-- Application Structure Plan: The application is designed as an interactive flashcard and quiz system to facilitate active learning, a more effective method than passive reading of a list. The structure includes: 1) Global controls for selecting word sets (pages or custom ranges) and study modes (Flashcard, Quiz, Spelling). 2) A central, focused interactive area for displaying the current card/question. 3) Navigation and progress tracking to orient the user. 4) A searchable full-list view for reference. 5) A post-session review screen showing incorrect words with an option to re-study them. This task-oriented design (Study, Test, Reference, Review) was chosen to give users clear, distinct ways to engage with the vocabulary, enhancing usability and learning efficiency. -->
    <!-- Visualization & Content Choices: The vocabulary list is transformed into interactive components. Report Info: Word pairs. Goal: Learn/Memorize. Presentation: HTML/CSS Flashcard. Interaction: Click-to-flip. Justification: Active recall is better for memory. Library: Vanilla JS/CSS. Report Info: Word pairs. Goal: Test Knowledge. Presentation: Multiple-choice quiz UI. Interaction: Click to answer, immediate feedback. Justification: Self-assessment reinforces learning. Library: Vanilla JS. Report Info: Word pairs. Goal: Test Spelling. Presentation: Text input UI. Interaction: User types answer, receives feedback. Justification: Reinforces correct spelling. Library: Vanilla JS. Report Info: Full word list. Goal: Reference/Lookup. Presentation: Searchable HTML table. Interaction: Real-time text filtering. Justification: Provides quick access to specific terms. Library: Vanilla JS. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FDFBF7;
            color: #3a3a3a;
        }
        .card {
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-face-back {
            transform: rotateY(180deg);
        }
        .btn {
            transition: all 0.2s ease-in-out;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-nav {
            background-color: #8D9B6A;
            color: white;
        }
        .btn-nav:hover {
            background-color: #748254;
        }
        .btn-nav:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-mode.active {
            background-color: #BF9270;
            color: white;
            border-color: #BF9270;
        }
        .quiz-option, #spelling-input {
            border: 2px solid #D1C7B7;
            background-color: white;
        }
        .quiz-option:hover, #spelling-input:focus {
            border-color: #BF9270;
            background-color: #F9F6F0;
        }
        .correct {
            background-color: #A8D8B9 !important;
            border-color: #5F9671 !important;
        }
        .incorrect {
            background-color: #F8BABA !important;
            border-color: #D87070 !important;
        }
        .disabled {
            pointer-events: none;
            opacity: 0.7;
        }
    </style>

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

                </div>`;
                return;
            }
            const word = state.currentWords[state.currentIndex];
            const isEnToKo = state.currentMode === 'quiz-en-ko';
            const question = isEnToKo ? word.english : word.korean;
            const correctAnswer = isEnToKo ? word.korean : word.english;

            const options = [correctAnswer];
            const otherWords = state.currentWords.filter(w => w.id !== word.id);
            shuffleArray(otherWords);

            for (let i = 0; i < 3 && i < otherWords.length; i++) {
                options.push(isEnToKo ? otherWords[i].korean : otherWords[i].english);
            }
            shuffleArray(options);

            mainContent.innerHTML = `
                <div class="w-full max-w-md text-center">
                    <div class="bg-white rounded-xl shadow-lg p-6 mb-4">
                        <h3 class="text-3xl font-bold mb-2">${question}</h3>

                </div>
                 ${renderNavigation(true)}
            `;

            const optionButtons = mainContent.querySelectorAll('.quiz-option');
            optionButtons.forEach(button => {
                button.addEventListener('click', (e) => handleAnswer(e.target.textContent === correctAnswer, e.target, optionButtons, correctAnswer));
            });
        }

            if (state.currentWords.length === 0) {
                mainContent.innerHTML = `<p class="text-gray-500">학습할 단어를 선택해주세요.</p>`;
                return;

            const word = state.currentWords[state.currentIndex];
            mainContent.innerHTML = `

                 ${renderNavigation(true)}
            `;
            const input = document.getElementById('spelling-input');
            const checkBtn = document.getElementById('spelling-check-btn');
            
            const checkAnswer = () => {
                const userAnswer = input.value.trim();
                if (!userAnswer) return;
                const isCorrect = userAnswer.toLowerCase() === word.english.toLowerCase();
                handleAnswer(isCorrect, input, [checkBtn, input], word.english);
            };

            checkBtn.addEventListener('click', checkAnswer);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    checkAnswer();
                }
            });
            input.focus();
        }

        function handleAnswer(isCorrect, targetElement, allElements, correctAnswer) {
            if (isCorrect) {
                state.score++;
                targetElement.classList.add('correct');
            } else {
                targetElement.classList.add('incorrect');
                state.incorrectWords.push(state.currentWords[state.currentIndex]);
                if (state.currentMode.startsWith('quiz')) {
                    allElements.forEach(btn => {
                        if (btn.textContent === correctAnswer) {
                            btn.classList.add('correct');
                        }
                    });
                } else if (state.currentMode === 'spelling') {
                    const feedbackEl = document.getElementById('spelling-feedback');
                    feedbackEl.innerHTML = `정답: <span class="font-bold text-[#748254]">${correctAnswer}</span>`;
                }
            }
            state.totalAnswered++;

            allElements.forEach(el => el.classList.add('disabled'));
            
            setTimeout(() => {
                if (state.currentIndex < state.currentWords.length - 1) {
                    state.currentIndex++;
                    updateContent();
                } else {
                    showResult();
                }
            }, 1800);
        }

                             <p class="text-center text-green-600 font-semibold">🎉 틀린 단어가 없습니다! 완벽해요! 🎉</p>
                        </div>
                    `;
                }
            }

            mainContent.innerHTML = `
                <div class="w-full max-w-lg text-center bg-white rounded-xl shadow-lg p-8">
                    <h2 class="text-2xl font-bold mb-4">학습 완료!</h2>
                    ${state.currentMode !== 'flashcard' ? `<p class="text-4xl font-bold text-[#BF9270] mb-2">${state.score} / ${state.totalAnswered}</p>` : ''}
                    <p class="text-lg text-gray-600 mb-6">수고하셨습니다!</p>
                    <div class="space-y-3">
                        <button id="restart-btn" class="btn btn-nav w-full p-3 rounded-lg font-semibold">현재 범위 다시 학습하기</button>
                        ${hasIncorrectWords ? `<button id="retry-incorrect-btn" class="btn w-full p-3 rounded-lg font-semibold bg-[#BF9270] text-white">틀린 단어 다시 학습하기</button>` : ''}
                    </div>
                    ${incorrectWordsHTML}
                </div>
            `;

            document.getElementById('restart-btn').addEventListener('click', () => {
                resetState(false, true);
                updateContent();
            });

            if (hasIncorrectWords) {
                document.getElementById('retry-incorrect-btn').addEventListener('click', startRetrySession);
            }
        }

        function startRetrySession() {
            if (state.incorrectWords.length === 0) return;
            state.currentWords = [...new Set(state.incorrectWords)]; 
            state.incorrectWords = [];
            state.currentIndex = 0;
            state.score = 0;
            state.totalAnswered = 0;

            if (state.currentMode.startsWith('quiz') || state.currentMode === 'spelling') {
                state.currentWords = shuffleArray(state.currentWords);
            }
            updateContent();
        }

        function renderNavigation(isTestMode = false) {
             if (state.currentWords.length === 0) return '';
            if (isTestMode) {
                 return `<div class="w-full max-w-md mt-6 text-center">
                            <p class="text-lg font-semibold">${state.score} / ${state.totalAnswered}</p>
                            <p class="text-sm text-gray-500">점수</p>
                        </div>`;
            }
            return `
                <div class="w-full max-w-md flex justify-between items-center mt-6">
                    <button id="prev-btn" class="btn btn-nav px-6 py-2 rounded-lg font-semibold" ${state.currentIndex === 0 ? 'disabled' : ''}>이전</button>
                    <span class="font-semibold">${state.currentIndex + 1} / ${state.currentWords.length}</span>
                    <button id="next-btn" class="btn btn-nav px-6 py-2 rounded-lg font-semibold" ${state.currentIndex === state.currentWords.length - 1 ? 'disabled' : ''}>다음</button>
                </div>
            `;
        }

        function updateContent() {
            if (state.currentMode === 'flashcard') {
                renderFlashcard();
            } else if (state.currentMode === 'spelling') {
                renderSpellingMode();
            } else {
                renderQuiz();
            }
            attachNavListeners();
        }
        
        function attachNavListeners() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    if (state.currentIndex > 0) {
                        state.currentIndex--;
                        updateContent();
                    }
                });
            }
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    if (state.currentIndex < state.currentWords.length - 1) {
                        state.currentIndex++;
                        updateContent();
                    }
                });
            }
        }

        function resetState(isCustomRange = false, keepWords = false) {
            state.currentIndex = 0;
            state.score = 0;
            state.totalAnswered = 0;
            state.incorrectWords = [];
            if (!keepWords) {
                if (isCustomRange) {
                    const from = parseInt(rangeFromInput.value) || 1;
                    const to = parseInt(rangeToInput.value) || words.length;
                    state.currentWords = words.filter(word => word.id >= from && word.id <= to);
                } else {
                    state.currentWords = words.filter(word => word.page === state.currentPage);
                }
            }
            
            if (state.currentMode.startsWith('quiz') || state.currentMode === 'spelling') {
                state.currentWords = shuffleArray([...state.currentWords]);
            }
        }

        function initialize() {
            const totalPages = Math.ceil(words.length / WORDS_PER_PAGE);
            pageSelect.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const option = document.createElement('option');
                option.value = i;
                const startWord = (i - 1) * WORDS_PER_PAGE + 1;
                const endWord = Math.min(i * WORDS_PER_PAGE, words.length);
                option.textContent = `Page ${i} (단어 ${startWord} ~ ${endWord})`;
                pageSelect.appendChild(option);
            }
            
            const customOption = document.createElement('option');
            customOption.value = "custom";
            customOption.textContent = "사용자 지정 범위";
            customOption.hidden = true;
            pageSelect.appendChild(customOption);

            pageSelect.addEventListener('change', (e) => {
                if(e.target.value === 'custom') return;
                state.currentPage = parseInt(e.target.value);
                rangeFromInput.value = '';
                rangeToInput.value = '';
                resetState();
                updateContent();
            });

            rangeStartBtn.addEventListener('click', () => {
                let from = parseInt(rangeFromInput.value);
                let to = parseInt(rangeToInput.value);

                if (!from && !to) return;
                from = from || 1;
                to = to || words.length;

                if (from > to) [from, to] = [to, from];
                from = Math.max(1, from);
                to = Math.min(words.length, to);
                
                rangeFromInput.value = from;
                rangeToInput.value = to;

                pageSelect.value = 'custom';
                resetState(true);
                updateContent();
            });

            modeSelector.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    state.currentMode = e.target.dataset.mode;
                    modeSelector.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    resetState(pageSelect.value === 'custom', true);
                    updateContent();
                }
            });
            
            toggleWordListBtn.addEventListener('click', () => {
                wordListContainer.classList.toggle('hidden');
                toggleWordListBtn.textContent = wordListContainer.classList.contains('hidden') ? '전체 단어 목록 보기' : '전체 단어 목록 숨기기';
                if (!wordListContainer.classList.contains('hidden')) {
                    populateWordListTable();
                }
            });

            searchBox.addEventListener('input', (e) => {
                populateWordListTable(e.target.value.toLowerCase());
            });

            modeSelector.querySelector(`[data-mode="${state.currentMode}"]`).classList.add('active');
            resetState();
            updateContent();
        }
        
        function populateWordListTable(searchTerm = '') {
            wordListTableBody.innerHTML = '';
            const filteredWords = words.filter(word => {
                return word.english.toLowerCase().includes(searchTerm) || word.korean.toLowerCase().includes(searchTerm);
            });

            filteredWords.forEach(word => {
                const row = `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${word.id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${word.english}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${word.korean}</td>
                    </tr>
                `;
                wordListTableBody.innerHTML += row;
            });
        }

        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
